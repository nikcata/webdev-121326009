<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab booking</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Lab booking</a>
      <nav id="account-nav" aria-label="Account"></nav>
    </header>
    <main>
      <section id="auth-panel" class="panel" aria-labelledby="auth-title">
        <h1 id="auth-title">Sign in to book a lab</h1>
        <p id="auth-description">Create an account or sign in to view lab availability.</p>
        <form id="auth-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          <button id="submit-auth" type="submit">Sign in</button>
        </form>
        <button id="toggle-auth" class="text-button" type="button">Create an account</button>
        <a class="google-button" href="/api/auth/google/start">Sign in or sign up with Google</a>
        <p id="auth-message" class="message" role="status" aria-live="polite"></p>
      </section>

      <section id="availability" hidden aria-labelledby="availability-title">
        <h1 id="availability-title">Available lab slots</h1>
        <p>Browse upcoming sessions and the number of seats available.</p>
        <button id="summary-button" type="button">Summarize availability</button>
        <p id="summary-message" class="message" role="status" aria-live="polite"></p>
        <form id="availability-filters" class="filters">
          <label for="lab-filter">Laboratory
            <select id="lab-filter" name="lab">
              <option value="">All laboratories</option>
            </select>
          </label>
          <label for="date-filter">Date
            <input id="date-filter" name="date" type="date">
          </label>
          <button type="submit">Apply filters</button>
          <button id="clear-filters" type="button">Clear filters</button>
        </form>
        <p id="list-message" class="message" role="status" aria-live="polite"></p>
        <ul id="slot-list" class="slot-list"></ul>
      </section>

      <section id="manager-panel" class="panel" hidden aria-labelledby="manager-title">
        <h2 id="manager-title">Manage laboratories and slots</h2>
        <h3>Add a laboratory</h3>
        <form id="manager-lab-form">
          <label for="new-lab-name">Laboratory name</label>
          <input id="new-lab-name" name="name" maxlength="100" required>
          <button id="add-lab-button" type="submit">Add laboratory</button>
        </form>
        <p id="manager-lab-message" class="message" role="status" aria-live="polite"></p>
        <ul id="manager-lab-list" class="lab-list"></ul>

        <h3>Create a lab slot</h3>
        <form id="manager-slot-form">
          <label for="slot-lab">Laboratory</label>
          <select id="slot-lab" name="labId" required>
            <option value="">Select a laboratory</option>
          </select>
          <label for="slot-start">Start time</label>
          <input id="slot-start" name="startsAt" type="datetime-local" required>
          <label for="slot-capacity">Seat capacity</label>
          <input id="slot-capacity" name="capacity" type="number" min="1" step="1" required>
          <button id="create-slot-button" type="submit">Create slot</button>
        </form>
        <p id="manager-slot-message" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
